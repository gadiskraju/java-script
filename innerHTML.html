<html>
    <head>
        <style>
            h4{
              text-align: left;
              text-transform: uppercase;
              color: #4CAF50;
        </style>
        <title>innerHTML</title>
    </head>
    <body>
        <!--inner html-->
        <h4>innerHTML</h4>
        <p id="demo">javascript</p>
        <button type="button" onclick='document.getElementById("demo").innerHTML="Hello javascript"'>click me</button>
        <hr>
         <!--font style-->
         <h4>Fontstyle</h4>
         <P id="demo1" >font style</P>
         <button type="button" onclick="document.getElementById('demo1').style.fontSize='35px'">click</button>
         <hr>
         <h4>Element hide</h4>
         <!--element hide-->
        <p id="demo3">element hide</p>
        <button type="button" onclick="document.getElementById('demo3').style.display='none'">click me</button>

        <h4>block</h4>
        <hr>
         <!--block display none-->
         <p id="demo4" style="display:none">hello javascript</p>
         <button type="button" onclick="document.getElementById('demo4').style.display='block'">click me</button>
         <hr>
    </body>
</html>
