<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .input-area {
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 120px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #3498db;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 5px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .feedback {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 27px;
        }

        .attempts {
            margin-top: 10px;
            font-size: 14px;
            color: #95a5a6;
        }

        .hidden {
            display: none;
        }

        #restart-btn {
            background-color: #2ecc71;
            margin-top: 15px;
            width: 100%;
            margin-left: 0;
        }

        #restart-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Guess the Number Game</h1>
        <p>I have chosen a secret number between 1 and 100. You have 10 attempts to guess it.</p>

        <div class="input-area">
            <input type="number" id="guess-input" min="1" max="100" placeholder="please enter">
            <button id="guess-btn">Guess</button>
        </div>

        <p class="feedback" id="feedback-msg"></p>
        <p class="attempts" id="attempts-msg">Attempts remaining: 10</p>
        
        <button id="restart-btn" class="hidden">Play Again</button>
    </div>

    <script>
        // --- 1. Game State Variables ---
        let secretNumber;
        let attemptsLeft;
        const maxAttempts = 10;

        // --- 2. DOM Elements ---
        const guessInput = document.getElementById('guess-input');
        const guessBtn = document.getElementById('guess-btn');
        const feedbackMsg = document.getElementById('feedback-msg');
        const attemptsMsg = document.getElementById('attempts-msg');
        const restartBtn = document.getElementById('restart-btn');

        // --- 3. Core Logic Functions ---
        
        // Randomization: Generates a new target number and resets parameters
        function initGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1; // Random number 1-100
            attemptsLeft = maxAttempts;
            
            feedbackMsg.textContent = '';
            feedbackMsg.style.color = '#000';
            attemptsMsg.textContent = `Attempts remaining: ${attemptsLeft}`;
            
            guessInput.value = '';
            guessInput.disabled = false;
            guessBtn.disabled = false;
            restartBtn.classList.add('hidden');
        }

        // Event-driven loop step processing via conditions
        function processGuess() {
            const userGuess = parseInt(guessInput.value);

            // Condition Check: Validate user input
            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                feedbackMsg.textContent = '❌ Please enter a valid number between 1 and 100.';
                feedbackMsg.style.color = '#e74c3c';
                return;
            }

            // Decrement loop state tracker
            attemptsLeft--;

            // Conditional evaluation logic
            if (userGuess === secretNumber) {
                // Win Condition
                feedbackMsg.textContent = `🎉 Correct! The number was ${secretNumber}!`;
                feedbackMsg.style.color = '#2ecc71';
                endGame();
            } else if (attemptsLeft === 0) {
                // Loss Condition
                feedbackMsg.textContent = `💥 Game Over! The correct number was ${secretNumber}.`;
                feedbackMsg.style.color = '#e74c3c';
                endGame();
            } else {
                // Continual Loop Feedback Conditions
                if (userGuess < secretNumber) {
                    feedbackMsg.textContent = '📉 Too low! Try a higher number.';
                } else {
                    feedbackMsg.textContent = '📈 Too high! Try a lower number.';
                }
                feedbackMsg.style.color = '#e67e22';
                attemptsMsg.textContent = `Attempts remaining: ${attemptsLeft}`;
            }

            // Clear input for next guess iteration
            guessInput.value = '';
            guessInput.focus();
        }

        function endGame() {
            guessInput.disabled = true;
            guessBtn.disabled = true;
            attemptsMsg.textContent = '';
            restartBtn.classList.remove('hidden'); // Reveal restart trigger
        }

        // --- 4. Event Listeners ---
        guessBtn.addEventListener('click', processGuess);
        
        // Allows pressing "Enter" inside the input box to submit
        guessInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                processGuess();
            }
        });

        restartBtn.addEventListener('click', initGame);

        // Initialize game session on window load
        initGame();
    </script>
</body>
</html>
